server:
  port: 8080

spring:
  application:
    name: "portfolio-backend"

  datasource:
    url: "jdbc:postgresql://localhost:5432/portfolio_db"
    username: "postgres"
    password: "${DB_PASSWORD:your_local_password}"
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: "portfolio"
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false
    locations: "classpath:db/migration"
    default-schema: "public"
    schemas:
      - public
      - auth
      - portfolio
      - audit

  servlet:
    multipart:
      max-file-size: "10MB"
      max-request-size: "20MB"

  mail:
    host: "smtp.gmail.com"
    port: 587
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

springdoc:
  swagger-ui:
    path: "/swagger-ui.html"

app:
  api:
    version: "v1"

  storage:
    type: "LOCAL"
    local-path: "uploads"

  security:
    jwt:
      secret: "${JWT_SECRET_BASE64:}"
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

  mail:
    from: "${MAIL_FROM:${MAIL_USERNAME:}}"

  email-verification:
    url: "http://localhost:5173/verify-email"
    expiry-minutes: 30

  refresh-token:
    expiry-days: 7

  bootstrap:
    super-admin:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
  media:
    upload-dir: "uploads/media"
